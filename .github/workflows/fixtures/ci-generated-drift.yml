name: CI Generated Drift Fixture

on:
  pull_request:

jobs:
  contract:
    name: Contract (fixture generated drift)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract dependencies
        run: python -m pip install PyYAML

      - name: Validate v1 contract
        run: python scripts/validate_data_contract.py contracts/v1 --json

      - name: Create generated registry drift
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/domain/generated/metrics.py")
          path.write_text(path.read_text(encoding="utf-8").replace("'storage_unit': 'm'", "'storage_unit': 'km'", 1), encoding="utf-8")
          PY

      - name: Check generated registry drift
        run: python scripts/check_generated_data_contract.py --json
