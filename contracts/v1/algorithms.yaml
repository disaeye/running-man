version: 1
algorithms:
  - key: activity_load
    version: 1.1.0
    input_window_days: 1
    materialization: stored_fact
    outputs: [normalized_power, intensity_factor, tss, normalized_graded_pace, gap_avg, efficiency_factor, aerobic_decoupling_pct, rtss]
    # Numeric anchors. Every entry is evaluated by
    # scripts/check_algorithm_references.py against the shipped code, so a
    # coefficient that drifts fails the contract gate instead of quietly
    # rescaling every derived load.
    reference_cases:
      - name: minetti_cost_at_10_percent_climb
        expect: { grade_cost_multiplier: 1.658 }
        tolerance: 0.005
        inputs: { grade: 0.10 }
      - name: minetti_cost_at_20_percent_climb
        expect: { grade_cost_multiplier: 2.502 }
        tolerance: 0.005
        inputs: { grade: 0.20 }
      - name: minetti_cost_at_10_percent_descent
        expect: { grade_cost_multiplier: 0.598 }
        tolerance: 0.01
        inputs: { grade: -0.10 }
      # NGP is the load input everything else is derived from, and its 4th power
      # belongs in the speed domain. Applying it to pace flips the direction: an
      # interval session would read slower than its own average instead of
      # harder. Constant pace cannot tell the two apart, which is why both a
      # steady and a variable case are pinned.
      - name: ngp_steady_3_m_s
        inputs: { steady_speed_m_s: 3.0, samples: 180 }
        expect: { normalized_graded_pace: 333.4034, gap_avg: 333.3333 }
        tolerance: 0.01
      - name: ngp_two_to_one_intervals
        # 120 s at 3.5 m/s then 60 s at 2.0 m/s, twice. Blocks are far longer
        # than the 30-sample smoothing window, so the 4th-power weighting
        # survives: NGP is faster than the 332.41 s/km average.
        inputs:
          pattern: [{ speed_m_s: 3.5, seconds: 120 }, { speed_m_s: 2.0, seconds: 60 }]
          cycles: 2
        expect: { normalized_graded_pace: 314.2166, gap_avg: 333.4882 }
        tolerance: 0.05
  - key: pmc
    version: 1.0.0
    input_window_days: 1
    materialization: stored_fact
    history_policy: full_available_history
    outputs: [daily_tss, ctl, atl, tsb, acwr]
    reference_cases:
      - name: ctl_atl_tsb_after_28_days_of_100_tss
        # 42-day and 7-day exponential decay from a zero seed. The numbers are
        # the anchor for both time constants at once.
        inputs: { daily_tss: 100, days: 28 }
        expect: { ctl: 49.0707, atl: 98.665, tsb: -49.5943 }
        tolerance: 0.001
  - key: physiology
    version: 1.2.0
    input_window_days: 365
    materialization: stored_fact
    calculations:
      - { key: hr_max, input_window_days: 730 }
      - { key: lthr, input_window_days: 365 }
      - { key: threshold_pace, input_window_days: 365 }
    outputs: [hr_max, lthr, threshold_pace]
    reference_cases:
      - name: lthr_from_best_effort_windows
        # LTHR = max(0.95 x best 20-minute, best 60-minute). The 20-minute
        # window sits above threshold and is corrected down; the 60-minute
        # window is a lower bound, because a rate held for an hour cannot be
        # above threshold. Five qualifying 20-minute windows is the minimum.
        inputs:
          best_20min_hrs: [178, 179, 180, 180, 180]
          best_60min_hrs: [175]
        expect: { lthr: 175 }
        tolerance: 0
      - name: threshold_pace_from_vdot_50
        # LT2 threshold pace, 88% of VDOT in the oxygen domain.
        inputs: { vdot: 50 }
        expect: { threshold_pace_s_per_km: 256 }
        tolerance: 3
      - name: hr_max_from_linear_session_ramp
        # The tangent line extrapolates above the highest session, but only
        # within a plausible headroom: a ceiling more than 6 bpm above anything
        # recorded is the fit running away, and the estimator then reports the
        # observed maximum instead. near_max_count counts sessions near the
        # observed maximum (180), not near the estimate.
        inputs: { start_bpm: 160, end_bpm: 180, sessions: 30 }
        expect: { hr_max: 184, near_max_count: 5 }
        tolerance: 0
  - key: vdot
    version: 1.1.0
    input_window_days: 365
    materialization: stored_fact
    outputs: [vdot]
    reference_cases:
      - name: vdot_from_5k_in_20_minutes
        inputs: { distance_m: 5000, time_s: 1200 }
        expect: { vdot: 49.8 }
        tolerance: 0.2
      - name: vdot_from_10k_in_41_20
        inputs: { distance_m: 10000, time_s: 2480 }
        expect: { vdot: 50.0 }
        tolerance: 0.3
      - name: daniels_easy_pace_for_vdot_50
        # Published: 5:34–6:13/km.
        inputs: { vdot: 50 }
        expect: { easy_min_s_per_km: 334, easy_max_s_per_km: 373 }
        tolerance: 4
      - name: daniels_threshold_pace_for_vdot_50
        # Published: 4:15/km.
        inputs: { vdot: 50 }
        expect: { threshold_min_s_per_km: 255 }
        tolerance: 4
