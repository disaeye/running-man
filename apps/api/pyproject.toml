[project]
name = "running-man-api"
version = "0.2.0"
description = "Personal running & fitness platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0",
    "fastapi>=0.111",
    "fitdecode>=0.11",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    # httpx is used with trust_env=True so deployments behind a proxy work.
    # The socks extra is required for that to function when the environment
    # sets ALL_PROXY to a socks5:// URL, which this host does: without it every
    # client construction raises ImportError at request time.
    "httpx[socks]>=0.27",
    "PyJWT>=2.13",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.3",
    "asyncpg>=0.29",
    "slowapi>=0.1.10",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.51",
    "lxml>=6.1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "vcrpy>=8.2",
    "fit-tool>=0.9.15",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "PL", "C901", "PTH", "RUF"]
# RUF001/002/003 flag intentional CJK punctuation (， （ ）) as "ambiguous".
# This is a Chinese-language app — CJK punctuation in strings/comments is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["PLR0913", "PLR0915", "PLR2004", "C901", "E501", "PLW0108", "PLC0415"]
"src/domain/**/*.py" = ["PLR2004"]
"alembic/**" = ["E501", "N999", "PLW2901"]
"src/infrastructure/db/pool.py" = ["PLW0603", "PLC0415"]
"src/presentation/api/integrations.py" = ["PLC0415", "E501", "PLR2004"]
# Call-time imports let tests patch application.computation.orchestration attrs.
"src/presentation/api/activities.py" = ["PLC0415"]
"src/presentation/api/activity_bulk_delete.py" = ["PLC0415"]
"src/presentation/api/share.py" = ["N812"]
"src/application/notifications/rules.py" = ["E501"]
"src/infrastructure/repositories/calendar.py" = ["E501"]
# Verbatim SQL function bodies: the lines come from PostgreSQL's own
# ``pg_get_functiondef`` output and wrapping them would change the SQL.
"src/infrastructure/db/migration_sql/*.py" = ["E501"]
"src/infrastructure/repositories/strength.py" = ["E501", "PLR2004"]
"src/infrastructure/repositories/activity.py" = ["E501"]
"src/infrastructure/repositories/activity_sql.py" = ["E501"]
"src/intervals/client.py" = ["PLR2004"]
"src/intervals/sync.py" = ["PLR2004"]
"src/infrastructure/parsing/fit_parser.py" = ["C901"]

[tool.ruff.lint.pylint]
max-args = 8
max-returns = 8
max-branches = 14
max-statements = 40
max-public-methods = 8

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fit_tool.*", "fitdecode.*", "vcr.*", "asyncpg.*", "lxml.*", "lxml.etree"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["infrastructure.*", "presentation.*", "domain.*", "parsing.*", "application.*"]
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["index", "attr-defined", "arg-type", "operator", "no-any-return", "type-arg", "call-overload", "union-attr", "unused-ignore", "no-untyped-def", "valid-type", "misc", "assignment", "return-value", "override", "redundant-cast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
markers = [
    "no_db: test does not need PostgreSQL transaction fixture",
]

[dependency-groups]
dev = [
    "alembic>=1.13",
]
